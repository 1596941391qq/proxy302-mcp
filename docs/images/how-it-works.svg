<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="How it works: your AI assistant talks to proxy302-mcp on your machine, which calls the Proxy302 API with your key and routes requests through residential proxies">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="58" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">How it works</text>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- 1 AI client -->
    <rect x="48" y="110" width="230" height="170" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="163" y="150" text-anchor="middle" font-size="15" fill="#64748b">1 · You ask</text>
    <text x="163" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Your AI assistant</text>
    <text x="163" y="218" text-anchor="middle" font-size="15" fill="#475569">Claude Code · Claude Desktop</text>
    <text x="163" y="240" text-anchor="middle" font-size="15" fill="#475569">Cursor · any MCP client</text>
    <!-- 2 proxy302-mcp -->
    <rect x="338" y="110" width="230" height="170" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="453" y="150" text-anchor="middle" font-size="15" fill="#0e7490">2 · Runs on your machine</text>
    <text x="453" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">proxy302-mcp</text>
    <text x="453" y="218" text-anchor="middle" font-size="15" fill="#475569">started by npx</text>
    <text x="453" y="240" text-anchor="middle" font-size="15" fill="#475569">read-only, never spends</text>
    <!-- 3 Proxy302 API -->
    <rect x="628" y="110" width="230" height="170" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="743" y="150" text-anchor="middle" font-size="15" fill="#64748b">3 · With your API key</text>
    <text x="743" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Proxy302 API</text>
    <text x="743" y="218" text-anchor="middle" font-size="15" fill="#475569">usage · countries · plans</text>
    <text x="743" y="240" text-anchor="middle" font-size="15" fill="#475569">proxy credentials</text>
    <!-- 4 Residential exit -->
    <rect x="918" y="110" width="234" height="170" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="1035" y="150" text-anchor="middle" font-size="15" fill="#047857">4 · Real residential IP</text>
    <text x="1035" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Any website</text>
    <text x="1035" y="218" text-anchor="middle" font-size="15" fill="#475569">fetched from the country</text>
    <text x="1035" y="240" text-anchor="middle" font-size="15" fill="#475569">you choose</text>
  </g>
  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="282" y1="195" x2="332" y2="195"/>
    <line x1="572" y1="195" x2="622" y2="195"/>
    <line x1="862" y1="195" x2="912" y2="195"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    <text x="307" y="312">MCP (stdio)</text>
    <text x="597" y="312">HTTPS</text>
    <text x="887" y="312">proxy</text>
  </g>
  <text x="48" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Your key stays on your machine. Nothing is bought, renewed or topped up; proxy traffic is billed only when you use it.</text>
</svg>
